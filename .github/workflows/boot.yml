name: build and boot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with the UEFI target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-uefi
      - name: Build
        run: cargo build --release --target x86_64-unknown-uefi
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Boot in QEMU, ask the boss a question over HTTPS
        run: OUT=$PWD/bootrun scripts/boot_test.sh "what is two plus two?"
      - name: Keep the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: bootrun/boot.log

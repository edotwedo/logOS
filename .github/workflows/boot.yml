name: build and boot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with the UEFI target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-uefi
      - name: Build
        run: cargo build --release --target x86_64-unknown-uefi
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Boot in QEMU and look for the banner
        run: |
          mkdir -p esp/EFI/BOOT
          cp target/x86_64-unknown-uefi/release/logos.efi esp/EFI/BOOT/BOOTX64.EFI
          OVMF=$(ls /usr/share/OVMF/OVMF_CODE*.fd /usr/share/ovmf/OVMF.fd 2>/dev/null | head -1)
          echo "firmware: $OVMF"
          timeout 90 qemu-system-x86_64 -m 1024 -nographic -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF" \
            -drive format=raw,file=fat:rw:esp \
            -serial mon:stdio > boot.log 2>&1 || true
          tail -40 boot.log
          grep -q "logOS v" boot.log
      - name: Keep the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: boot.log

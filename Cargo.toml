[package]
name = "logos"
version = "0.9.0"
edition = "2024"

[dependencies]
font8x8 = { version = "0.3.1", default-features = false }
libm = "0.2.16"
linked_list_allocator = "0.10"
log = "0.4.35"
rhai = { version = "1.27.0", default-features = false, features = ["no_std", "only_i64", "f32_float", "no_module", "no_time", "no_custom_syntax"] }
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-dhcpv4", "socket-dns"] }
uefi = { version = "0.41.0", features = ["alloc"] }
